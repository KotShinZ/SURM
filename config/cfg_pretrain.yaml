# ARC training config

defaults:
  - arch: urm
  - _self_

hydra:
  output_subdir: null

# Data path
data_path: data/arc-aug-1000

evaluators:
  - name: arc@ARC

# Hyperparams - Training
global_batch_size: 768
grad_accum_steps: 1

epochs: 200000
eval_interval: 10
eval_first: false
checkpoint_every_eval: True

lr: 1e-4
lr_min_ratio: 1.0
lr_warmup_steps: 2000

target_q_update_every: 4

# Standard hyperparameter settings for LM, as used in Llama
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
puzzle_emb_weight_decay: 0.1

# Hyperparams - Puzzle embeddings training
puzzle_emb_lr: 1e-2

use_muon: False
torch_compile: True

# Probe halting without gradients, then replay only halted samples with gradients.
halted_replay_training: False

# Fraction of training groups to use per epoch (1.0 = all, 0.5 = half)
data_fraction: 1.0
# Number of random examples sampled from each selected puzzle per training batch step.
# Set to null to restore the previous full-puzzle packing behavior.
examples_per_puzzle: 1

# Online augmentation: applied randomly per sample at training time.
# Detected automatically from seq_len: 900 → ARC-AGI, 81 → Sudoku.
# Set enabled: true to activate.
online_aug:
  enabled: false
  # ARC-AGI: dihedral symmetry (8 rotations/reflections)
  arc_dihedral: true
  # ARC-AGI: random permutation of the 10 color tokens
  arc_color_perm: true
  # Sudoku: random permutation of digits 1-9
  sudoku_digit_perm: true
  # Sudoku: random row/column/band permutation (preserves Sudoku validity)
  sudoku_row_col_perm: true
  # Sudoku: random transpose (swap rows ↔ columns)
  sudoku_transpose: true

# Replace model inputs with a randomly masked version of the label sequence.
# The model still predicts the full label sequence.
masked_input:
  enabled: false
  apply_probability: 0.2
  min_mask_ratio: 0.1
  max_mask_ratio: 0.5
  # Shared default across current datasets:
  # Sudoku: 1 = blank, ARC-AGI: 1 = EOS/unknown-like special token.
  mask_token_id: 1
  # Keep the original dataset input in batch["source_inputs"] for evaluators/debugging.
  preserve_source_inputs: true

arc_output_mask:
  enabled: true
  fill_mode: "zero" # Literal["zero", "random_color"] 

# PuzzleFullDataset answer-token initialization.
# black: fill the target answer slot with ARC black token id 2.
# noised_label: sample gamma ~ Uniform[min, max], then initialize each answer
# token from the true label with probability gamma, otherwise from random color noise.
full_answer_initial_mode: "black" # Literal["black", "noised_label"]
full_answer_initial_black_token_id: 2
full_answer_initial_gamma_min: 0.0
full_answer_initial_gamma_max: 1.0
full_answer_initial_noise_token_min: 2
full_answer_initial_noise_token_max: 11
