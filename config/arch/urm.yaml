name: urm.urm@URM
loss:
  name: losses@ACTLossHead
  loss_type: stablemax_cross_entropy
  label_mask: 0.0
  diff_L_loss_enabled: false
  diff_L_loss_weight: 100

loops: 16
num_layers: 8
H_layers: 0
L_layers: 0  # 0 falls back to num_layers unless explicitly set for HRM mode.
prelude_layers: 0
coda_layers: 0

hidden_size: 512
num_heads: 8
expansion: 4

H_cycles: 4
L_cycles: 3
grad_H_cycles: 1

loop_deltas: [0]

puzzle_emb_ndim: ${.hidden_size}
pos_encodings: rope
# 4D RoPE: set depth/io/height/width to enable explicit (pair,io,row,col) rotary positions.
# 3D RoPE: leave io=0 and set depth/height/width for (depth,row,col).
# 2D RoPE: leave depth=0/io=0 and set height/width only.
# 0 (default) falls back to standard 1D RoPE.
grid_depth: 0
grid_io: 0
grid_height: 0
grid_width: 0

# Enable timing profile output during training for debugging
profile: true
forward_mode: standard  # standard | answer_only | prefix_lm | casual
answer_only_context_layers: 0
label_separate: false
SeparateMode: D  # C | D
label_separate_noise_token_min: 2
label_separate_noise_token_max: null
label_separate_C_noise_scale: 1.0

eval_interval: 1000
checkpoint_every_eval: True
checkpoint_path: .cache/checkpoint

ema: True
ema_rate: 0.999

attn_dropout: 0.0
mlp_dropout: 0.0
attention_type: full  # full | SWA | SWA2D | LSA | topK
attention_window_size: -1  # Scalar broadcasts to all layers. Use -1 for full attention, or e.g. [128, 128, 128, -1] for per-layer total SWA windows (128 -> (64, 64)).
attention_window_size_2d: 1  # Used by SWA2D as the row/col radius.
attention_topk: 0  # Used by topK. Keeps exactly this many tokens per query when > 0.
topk_sparsity: 0.0  # fraction of attention scores to drop (e.g. 0.8 = keep top 20%)

use_act: False
norm_diff_max: 0.1
norm_diff_min: 0.001
input_embedding_noise_size: 0.0
input_injection_enabled: True
noise_size: 0.0
noise_seed: 42

# Recurrent hidden initialization for answer slots.
# default: initialize current_hidden with URM's original learned init_hidden buffer.
# black: initialize current_hidden to zeros.
# random: initialize current_hidden from N(0, answer_initial_random_std).
# noised_label_C: train from alpha * label embedding + sqrt(1 - alpha^2) * eps,
#   where eps is Gaussian and alpha is sampled from uniform or beta; eval from eps only.
# noised_label_D: initialize answer hidden states from embeddings of labels with a random
#   per-sample fraction replaced by random non-pad/eos tokens; eval from fully random embeddings.
answer_initial_mode: default
answer_initial_random_std: 1.0
answer_initial_C_noise_distribution: beta  # uniform | beta
answer_initial_C_noise_scale: 1.0
answer_initial_C_beta_alpha: 1.0
answer_initial_C_beta_beta: 2.0
answer_initial_D_ratio_distribution: uniform  # constant | normal | uniform
answer_initial_D_ratio_min: 0.0
answer_initial_D_ratio_max: 1.0
answer_initial_D_ratio_mean: 0.5
answer_initial_D_ratio_std: 0.25
answer_initial_random_token_min: 2
answer_initial_random_token_max: null
answer_initial_pad_token_id: 0
answer_initial_eos_token_id: 1
# Set true only for debugging; eval will otherwise avoid label-content initialization.
answer_initial_use_labels_in_eval: false
