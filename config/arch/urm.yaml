name: urm.urm@URM
loss:
  name: losses@ACTLossHead
  loss_type: stablemax_cross_entropy
  label_mask: 0.0
  diff_L_loss_enabled: false
  diff_L_loss_weight: 100

loops: 16
num_layers: 8
H_layers: 0
L_layers: 0  # 0 falls back to num_layers unless explicitly set for HRM mode.
prelude_layers: 0
coda_layers: 0

hidden_size: 512
num_heads: 8
expansion: 4

H_cycles: 4
L_cycles: 3
grad_H_cycles: 1

loop_deltas: [0]

puzzle_emb_ndim: ${.hidden_size}
pos_encodings: rope
# 4D RoPE: set depth/io/height/width to enable explicit (pair,io,row,col) rotary positions.
# 3D RoPE: leave io=0 and set depth/height/width for (depth,row,col).
# 2D RoPE: leave depth=0/io=0 and set height/width only.
# 0 (default) falls back to standard 1D RoPE.
grid_depth: 0
grid_io: 0
grid_height: 0
grid_width: 0

# Enable timing profile output during training for debugging
profile: true
answer_only: false
answer_only_context_layers: 0

eval_interval: 1000
checkpoint_every_eval: True
checkpoint_path: .cache/checkpoint

ema: True
ema_rate: 0.999

attn_dropout: 0.0
mlp_dropout: 0.0
attention_type: full  # full | SWA | SWA2D | LSA | topK
attention_window_size: -1  # Scalar broadcasts to all layers. Use -1 for full attention, or e.g. [128, 128, 128, -1] for per-layer total SWA windows (128 -> (64, 64)).
attention_window_size_2d: 1  # Used by SWA2D as the row/col radius.
attention_topk: 0  # Used by topK. Keeps exactly this many tokens per query when > 0.
topk_sparsity: 0.0  # fraction of attention scores to drop (e.g. 0.8 = keep top 20%)

use_act: False
norm_diff_max: 0.1
norm_diff_min: 0.001
input_embedding_noise_size: 0.0
input_injection_enabled: True
noise_size: 0.0
noise_seed: 42
